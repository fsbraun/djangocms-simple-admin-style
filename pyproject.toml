[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "djangocms-simple-admin-style"
description = "Adds pretty CSS styles for the django CMS admin interface."
readme = "README.rst"
license = "BSD-3-Clause"
maintainers = [
  { name = "Django CMS Association and contributors", email = "info@django-cms.org" },
]
authors = [
  { name = "Fabian Braun", email = "fsbraun@gmx.de" },
]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Framework :: Django CMS",
  "Framework :: Django CMS :: 3.11",
  "Framework :: Django CMS :: 4.0",
  "Framework :: Django CMS :: 4.1",
  "Framework :: Django CMS :: 5.0",
  "Framework :: Django CMS :: 5.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
]
dynamic = [ "version" ]
dependencies = [
  "django-cms",
]
# The test suite runs a plain Django admin and stubs `cms`, so django-cms is
# deliberately not required to run it -- see tests/settings.py.
optional-dependencies.test = [
  "beautifulsoup4",
  "packaging",
  "soupsieve",
]
urls.Homepage = "https://github.com/fsbraun/djangocms-simple-admin-style"

[tool.hatch]
version.path = "djangocms_simple_admin_style/__init__.py"
build.targets.sdist.include = [
  "/djangocms_simple_admin_style",
]

[tool.ruff]
line-length = 119
# Keep ruff's defaults (pycodestyle errors, pyflakes, isort) and add flake8-print:
# render_update_notification runs on every superuser admin index load, so a stray
# print() there ends up in production logs.
lint.extend-select = [ "T20" ]
# Django's ModelAdmin/Model API is declarative: `actions`, `inlines` and choices
# lists are class attributes by design, not accidental mutable defaults.
lint.ignore = [ "RUF012" ]

[tool.flake8]
max-line-length = 119
