name: django CMS tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django ${{ matrix.django }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { django: "5.2", python: "3.10" }
          - { django: "5.2", python: "3.14" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Deliberately NOT `pip install .`: the package depends on django-cms,
          # which pins Django and would collapse this matrix. The test settings
          # run a plain Django admin and stub `cms` where it is needed.
          pip install beautifulsoup4 soupsieve packaging
          pip install "Django~=${{ matrix.django }}.0"
      - name: Show versions
        run: python -c "import django; print('Django', django.get_version())"
      - name: Run tests
        run: python -m django test tests --settings=tests.settings -v 2

  css:
    name: css
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Lint stylesheets
        run: npx stylelint "private/*.css"
      - name: Rebuild the minified stylesheets
        run: ./minify-css
      - name: Check the committed build is up to date
        # The served CSS is the built file, so a source edit without a rebuild
        # ships nothing. `npm ci` pins the minifier and its browserslist data,
        # so the output is reproducible.
        run: |
          if ! git diff --exit-code -- djangocms_simple_admin_style/static; then
            echo "::error::The minified CSS is stale. Run ./minify-css and commit the result."
            exit 1
          fi
