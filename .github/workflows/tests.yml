name: django CMS tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django ${{ matrix.django }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { django: "main", python: "3.12" }
          - { django: "main", python: "3.14" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Deliberately NOT `pip install .`: the package depends on django-cms,
          # which pins Django and would collapse this matrix. The test settings
          # run a plain Django admin and stub `cms` where it is needed.
          pip install beautifulsoup4 soupsieve packaging
          pip install "https://github.com/django/django/archive/refs/heads/main.tar.gz"
      - name: Show versions
        run: python -c "import django; print('Django', django.get_version())"
      - name: Run tests
        run: python -m django test tests --settings=tests.settings -v 2

  css:
    name: css
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Lint stylesheets
        run: npx stylelint "djangocms_simple_admin_style/static/**/*.css"
